<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>You're invited!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b3a;
    --muted: #55557a;
    --bg: #eef0ff;
    --card: #ffffff;
    --pink: #ff4f81;
    --pink-dark: #c9215a;
    --sun: #ffc93c;
    --line: #d6d9f5;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 17px; line-height: 1.6;
  }
  .demo-bar { background: var(--ink); color: #fff; text-align: center; font-size: 14px; padding: 8px 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 0 20px 64px; }

  .hero { padding: 56px 0 32px; text-align: left; }
  .hero p.lead { margin: 0 0 8px; color: var(--muted); }
  .hero h1 {
    font-family: var(--display); font-weight: 600;
    font-size: clamp(48px, 15vw, 84px); line-height: 1; margin: 0 0 20px;
  }
  .hero h1 .age {
    display: inline-block; background: var(--sun); color: var(--ink);
    padding: 0 .22em; border-radius: .3em; transform: rotate(-4deg);
  }
  .hero .when { font-size: 20px; font-weight: 500; margin: 0; }

  section { background: var(--card); border-radius: 16px; padding: 24px; margin-top: 16px; border: 1px solid var(--line); }
  h2 { font-family: var(--display); font-weight: 500; font-size: 24px; margin: 0 0 12px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; }
  .note { margin: 14px 0 0; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: 500 17px var(--body); min-height: 48px; padding: 0 22px;
    border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink);
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
  .btn.primary:hover { background: var(--pink-dark); border-color: var(--pink-dark); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .btn-row .btn { flex: 1 1 150px; }
  .address { margin: 0; font-weight: 500; }

  dialog {
    width: min(92vw, 480px); border: 0; border-radius: 18px; padding: 0;
    background: var(--card); color: var(--ink);
  }
  dialog::backdrop { background: rgba(27, 27, 58, .55); }
  .dlg { padding: 24px; }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .dlg-head h2 { margin: 0; }
  .close { border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--ink); padding: 6px 10px; border-radius: 8px; }
  .close:hover { background: var(--bg); }

  label, legend { display: block; font-weight: 500; margin: 16px 0 6px; padding: 0; }
  input[type=text], input[type=number], textarea {
    width: 100%; font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 80px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice label { margin: 0; }
  .choice input { position: absolute; opacity: 0; }
  .choice span {
    display: flex; align-items: center; justify-content: center; min-height: 48px;
    border: 2px solid var(--line); border-radius: 12px; cursor: pointer; text-align: center; padding: 0 8px;
  }
  .choice input:checked + span { border-color: var(--ink); background: var(--sun); }
  .choice input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .error { color: #a3162f; margin: 12px 0 0; min-height: 1.4em; }
  .submit { width: 100%; margin-top: 12px; }
  .submit[disabled] { opacity: .6; cursor: wait; }
  .hidden { display: none !important; }
  .thanks h2 { font-size: 28px; }
  .thanks p { margin: 8px 0 0; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="demo-bar">Demo invitation. Event details are fictional. Please use made-up names.</div>
<main>
  <header class="hero">
    <p class="lead" id="lead"></p>
    <h1 id="title"></h1>
    <p class="when" id="when"></p>
  </header>

  <section aria-labelledby="h-details">
    <h2 id="h-details">Party details</h2>
    <dl id="details"></dl>
    <p class="note" id="hostnote"></p>
  </section>

  <section aria-labelledby="h-where">
    <h2 id="h-where">Where</h2>
    <p class="address" id="venue"></p>
    <p class="address" id="address" style="font-weight:400;color:var(--muted)"></p>
    <div class="btn-row">
      <a class="btn" id="waze" target="_blank" rel="noopener">Drive with Waze</a>
      <a class="btn" id="gmaps" target="_blank" rel="noopener">Drive with Google Maps</a>
    </div>
  </section>

  <section aria-labelledby="h-rsvp">
    <h2 id="h-rsvp">Will you come?</h2>
    <p style="margin:0" id="rsvpby"></p>
    <div class="btn-row"><button class="btn primary" id="open-rsvp" type="button">RSVP</button></div>
  </section>
</main>

<dialog id="rsvp" aria-labelledby="dlg-title">
  <div class="dlg">
    <div id="form-view">
      <div class="dlg-head">
        <h2 id="dlg-title">RSVP</h2>
        <button class="close" type="button" id="close-rsvp" aria-label="Close">&times;</button>
      </div>
      <form id="form" novalidate>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>

        <fieldset>
          <legend>Can you make it?</legend>
          <div class="choice">
            <label><input type="radio" name="status" value="Going" required><span>Yes, we're coming</span></label>
            <label><input type="radio" name="status" value="Not going"><span>Sorry, can't make it</span></label>
          </div>
        </fieldset>

        <div id="attendees" class="hidden">
          <label for="count">How many guests are coming? (include yourself)</label>
          <input type="number" id="count" name="count" min="1" max="20" value="1" inputmode="numeric">
          <fieldset id="names-set">
            <legend>Full name of each guest</legend>
            <p class="note" style="margin:0 0 4px">We use these for placemats and seating.</p>
            <div id="names"></div>
          </fieldset>
        </div>

        <label for="note">Note for the host (optional)</label>
        <textarea id="note" name="note" placeholder="Allergies, a song request, anything else"></textarea>

        <input type="text" name="company" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
        <p class="error" id="error" role="alert"></p>
        <button class="btn primary submit" id="submit" type="submit">Send RSVP</button>
      </form>
    </div>

    <div id="thanks-view" class="thanks hidden">
      <div class="dlg-head"><h2 id="thanks-title">Thank you!</h2>
        <button class="close" type="button" id="close-thanks" aria-label="Close">&times;</button></div>
      <p id="thanks-msg"></p>
      <div class="btn-row"><button class="btn" type="button" id="edit">Change my answer</button></div>
    </div>
  </div>
</dialog>

<script>
/* ===== EDIT THIS BLOCK ===== */
const EVENT = {
  guestOfHonor: "Sofia",
  age: 7,
  dateText: "Saturday, November 14, 2026",
  timeText: "4:00 PM to 7:00 PM",
  venue: "Parque Mirador Sur",
  address: "Av. Mirador Sur, Santo Domingo",
  mapsQuery: "Parque Mirador Sur, Santo Domingo",
  extras: [
    ["Dress code", "Come ready to play"],
    ["Host", "The Demo Family"]
  ],
  hostNote: "Cake at 5:30. Parking is available on site.",
  rsvpBy: "Please reply by Saturday, November 7.",
  scriptUrl: "https://script.google.com/macros/s/AKfycbwDGDRNw53ofTQjQRSatUHgSqaeQ2xwf1SHPAVnw9A7JvafrydcJvPwqXE9lIOuupOh/exec"
};
/* =========================== */

const $ = id => document.getElementById(id);

document.title = EVENT.guestOfHonor + "'s birthday invitation";
$("lead").textContent = "You're invited to";
$("title").innerHTML = "";
$("title").append(EVENT.guestOfHonor + "'s ");
const age = document.createElement("span");
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
age.className = "age"; age.textContent = ord(EVENT.age);
$("title").append(age);
$("title").append(" birthday");
$("when").textContent = EVENT.dateText + ", " + EVENT.timeText;

const rows = [["Date", EVENT.dateText], ["Time", EVENT.timeText], ...EVENT.extras];
rows.forEach(([k, v]) => {
  const dt = document.createElement("dt"); dt.textContent = k;
  const dd = document.createElement("dd"); dd.textContent = v;
  $("details").append(dt, dd);
});
$("hostnote").textContent = EVENT.hostNote;
$("venue").textContent = EVENT.venue;
$("address").textContent = EVENT.address;
$("rsvpby").textContent = EVENT.rsvpBy;

const q = encodeURIComponent(EVENT.mapsQuery);
$("waze").href = "https://waze.com/ul?q=" + q + "&navigate=yes";
$("gmaps").href = "https://www.google.com/maps/dir/?api=1&destination=" + q + "&travelmode=driving";

const dlg = $("rsvp"), form = $("form");
const showForm = () => { $("form-view").classList.remove("hidden"); $("thanks-view").classList.add("hidden"); };
$("open-rsvp").addEventListener("click", () => { showForm(); dlg.showModal(); });
$("close-rsvp").addEventListener("click", () => dlg.close());
$("close-thanks").addEventListener("click", () => dlg.close());
$("edit").addEventListener("click", showForm);
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

function renderNameFields() {
  const n = Math.min(20, Math.max(1, parseInt($("count").value || "1", 10) || 1));
  const box = $("names");
  const old = Array.from(box.querySelectorAll("input")).map(i => i.value);
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const lab = document.createElement("label");
    lab.htmlFor = "guest-" + i;
    lab.textContent = "Guest " + (i + 1);
    const inp = document.createElement("input");
    inp.type = "text"; inp.id = "guest-" + i; inp.className = "guest-name";
    inp.autocomplete = "off"; inp.value = old[i] || "";
    box.append(lab, inp);
  }
}

form.addEventListener("change", e => {
  const going = form.status.value === "Going";
  $("attendees").classList.toggle("hidden", !going);
  if (going && e.target.name === "status" && !$("names").children.length) {
    renderNameFields();
    const first = $("guest-0");
    if (first && !first.value) first.value = form.name.value.trim();
  }
});
$("count").addEventListener("input", renderNameFields);

form.addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("error"); err.textContent = "";
  const name = form.name.value.trim();
  const status = form.status.value;
  if (!name) { err.textContent = "Enter your name."; form.name.focus(); return; }
  if (!status) { err.textContent = "Choose whether you can come."; return; }
  const going = status === "Going";
  let guests = [];
  if (going) {
    const fields = Array.from(document.querySelectorAll(".guest-name"));
    guests = fields.map(f => f.value.trim());
    const empty = fields.find(f => !f.value.trim());
    if (!fields.length || empty) {
      err.textContent = "Enter a name for every guest.";
      (empty || $("count")).focus();
      return;
    }
  }
  if (form.company.value) return;

  const btn = $("submit"); btn.disabled = true; btn.textContent = "Sending...";
  const body = new URLSearchParams({
    name, status,
    count: guests.length,
    guests: JSON.stringify(guests),
    note: form.note.value.trim()
  });
  try {
    await fetch(EVENT.scriptUrl, { method: "POST", mode: "no-cors", body });
    $("thanks-title").textContent = going ? "See you there!" : "Thanks for letting us know";
    $("thanks-msg").textContent = going
      ? "We have " + guests.length + (guests.length === 1 ? " guest" : " guests") + " down: " + guests.join(", ") + "."
      : "We'll miss you, " + name + ".";
    $("form-view").classList.add("hidden");
    $("thanks-view").classList.remove("hidden");
  } catch (_) {
    err.textContent = "We couldn't send your RSVP. Check your connection and try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Send RSVP";
  }
});
</script>
</body>
</html>
